<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>@Empty23AM</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1c1917 url('83059cadf5a9f1190c93dee7fc6f2dbe.jpg') center/cover no-repeat;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:rgba(255,250,240,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(253,230,138,.85);border-radius:26px;padding:24px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 45px rgba(28,25,23,.45)}
.shake{animation:sh .35s ease}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.top{position:relative;width:230px;height:100px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.ava{width:90px;height:90px;border-radius:50%;overflow:hidden;border:3px solid #fde68a;box-shadow:0 8px 20px rgba(180,83,9,.2);z-index:2}
.ava img,.slot img,.gi img,.clk img{width:100%;height:100%;object-fit:cover;display:block}
.dec{position:absolute;color:#c99a62;pointer-events:none}
.name{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
h1{font-size:21px;font-weight:700;color:#292524}
p{font-size:13px;color:#57534e;margin-bottom:14px;line-height:1.35}
.tbox{background:rgba(254,243,199,.65);border:1px solid rgba(253,230,138,.7);border-radius:16px;padding:10px;margin-bottom:14px}
.tt{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#b45309;font-weight:700;margin-bottom:2px}
.tv{font-size:17px;font-weight:700;color:#292524;font-variant-numeric:tabular-nums}
.btn{width:100%;padding:13px;border:none;border-radius:15px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity .2s,transform .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.b1{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 6px 16px rgba(217,119,6,.35)}
.b2{background:rgba(255,255,255,.9);color:#44403c;border:1px solid #fde68a}
.rst{background:transparent;border:none;color:#a8a29e;font-size:12px;font-weight:600;padding:6px 12px;margin-top:2px;cursor:pointer;text-decoration:underline}
.res{margin-top:4px;font-size:13px;min-height:18px;color:#b45309;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:6px}
.sm{padding:6px 10px;border-radius:11px;border:1px solid #fde68a;background:#fff;color:#78350f;font-size:12px;font-weight:600;cursor:pointer}
.bal{padding:6px 10px;border-radius:11px;background:rgba(254,243,199,.9);border:1px solid #fde68a;color:#b45309;font-size:12px;font-weight:700}
.cbw{width:100%;height:10px;background:rgba(254,243,199,.9);border-radius:9px;overflow:hidden;border:1px solid #fde68a;margin:8px 0 4px}
.cbf{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#ea580c);transition:width .12s}
.cbt{font-size:11px;font-weight:700;color:#b45309;min-height:16px;margin-bottom:4px}
.clk{width:160px;height:160px;border-radius:50%;overflow:hidden;margin:6px auto 16px;background:rgba(254,243,199,.7);border:4px solid #f59e0b;box-shadow:0 12px 28px rgba(217,119,6,.3);cursor:pointer;transition:transform .08s}
.clk:active{transform:scale(.91)}
.pop{position:fixed;pointer-events:none;font-weight:700;font-size:18px;color:#b45309;text-shadow:0 2px 6px rgba(255,255,255,.9);animation:fly .65s ease-out forwards;z-index:99}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-95px) scale(1.2)}}
.slot{width:180px;height:180px;margin:0 auto 14px;border-radius:20px;overflow:hidden;border:3px solid #fde68a;background:rgba(254,243,199,.5);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 25px rgba(180,83,9,.15)}
.tag{position:absolute;bottom:8px;padding:3px 10px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.r0{background:#78716c}.r1{background:#0284c7}.r2{background:linear-gradient(135deg,#f59e0b,#b45309)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:330px;overflow-y:auto;padding:2px}
.gi{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:2px solid #fde68a;background:#e7e5e4}
.gi.lk img{filter:grayscale(1) brightness(.32)}
.gi .qm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.gi .gt{position:absolute;bottom:0;inset-x:0;font-size:9px;font-weight:700;color:#fff;padding:2px 0;text-align:center}
.row{display:flex;gap:8px;margin-top:16px}
.bred{background:#fecaca;color:#991b1b;border:1px solid #fca5a5}
.ov{position:fixed;inset:0;background:rgba(28,25,23,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;z-index:200}
.ov img{width:100%;max-width:310px;aspect-ratio:1/1;object-fit:cover;border-radius:24px;border:3px solid #fde68a;box-shadow:0 20px 50px rgba(0,0,0,.6)}
</style>
<script>
var k=0,m=parseInt(localStorage.getItem('m15')||'0'),u=JSON.parse(localStorage.getItem('u15')||'[]'),cb=0,x2=0;
function updM(){
  if(document.getElementById('m1'))document.getElementById('m1').innerText=m;
  if(document.getElementById('m2'))document.getElementById('m2').innerText=m;
  if(document.getElementById('cnt'))document.getElementById('cnt').innerText=u.length;
  localStorage.setItem('m15',m);
}
function go(v){
  ['v1','v2','v3','v4','v5'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display=(id===v)?'block':'none';});
  updM();
  if(v==='v3'){
    var h='';
    for(var i=1;i<=15;i++){
      var op=u.indexOf(i)>-1,rk=i<=7?0:(i<=12?1:2),nm=rk===0?'Обычный':(rk===1?'Редкий':'Легендарный');
      h+='<div class="gi '+(op?'':'lk')+'" '+(op?'onclick="big('+i+','+rk+',\''+nm+'\')"':'')+'><img src="s'+i+'.jpg">'+(op?'':'<div class="qm">?</div>')+'<div class="gt r'+rk+'">'+nm+'</div></div>';
    }
    document.getElementById('gr').innerHTML=h;
  }
}
function big(i,rk,nm){var o=document.getElementById('ov');o.innerHTML='<img src="s'+i+'.jpg"><div class="tag r'+rk+'" style="position:static;margin-top:14px;font-size:14px;padding:6px 16px">'+nm+'</div><p style="color:#fde68a;margin-top:12px">Нажми в любое место, чтобы закрыть</p>';o.style.display='flex';}
function tap(e){
  var add=x2>0?2:1;m+=add;updM();
  if(x2<=0){cb=Math.min(100,cb+7);if(cb>=100)x2=50;}
  if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.impactOccurred(x2>0?'medium':'light');
  var el=document.createElement('div');el.className='pop';el.innerText=x2>0?'🔥 +2':'🪙 +1';
  var x=(e&&e.clientX)?e.clientX:innerWidth/2,y=(e&&e.clientY)?e.clientY:innerHeight/2;
  el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  setTimeout(function(){el.remove();},650);
}
setInterval(function(){
  if(x2>0){x2--;cb=x2*2;if(document.getElementById('cbt'))document.getElementById('cbt').innerText='🔥 РЕЖИМ ×2! ('+(x2/10).toFixed(1)+'с)';}
  else{if(cb>0)cb=Math.max(0,cb-2);if(document.getElementById('cbt'))document.getElementById('cbt').innerText=cb>0?'Комбо: '+cb+'%':'Кликай быстро для ×2!';}
  if(document.getElementById('cbf'))document.getElementById('cbf').style.width=cb+'%';
},100);
function wipe(){m=0;u=[];localStorage.setItem('m15','0');localStorage.setItem('u15','[]');document.getElementById('sl').innerHTML='<span style="font-size:44px">🎁</span>';document.getElementById('mr').innerText='✨ Прогресс сброшен!';go('v2');}
function roll(){
  var b=document.getElementById('rb');if(b.disabled)return;
  if(m<3){document.getElementById('mr').innerText='❌ Нужно 3 🪙! Покликай ещё';return;}
  document.getElementById('mr').innerText='';m-=3;updM();
  var r=Math.random(),i=r<.6?Math.floor(Math.random()*7)+1:(r<.9?Math.floor(Math.random()*5)+8:Math.floor(Math.random()*3)+13);
  var rk=i<=7?0:(i<=12?1:2),nm=rk===0?'Обычный':(rk===1?'Редкий':'Легендарный');
  if(u.indexOf(i)<0){u.push(i);localStorage.setItem('u15',JSON.stringify(u));}
  updM();
  var c=document.getElementById('c');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  document.getElementById('sl').innerHTML='<img src="s'+i+'.jpg"><div class="tag r'+rk+'">'+nm+'</div>';
  b.disabled=true;var t=3;b.innerText='⏳ Подождите '+t+'с...';
  var iv=setInterval(function(){t--;if(t>0){b.innerText='⏳ Подождите '+t+'с...';}else{clearInterval(iv);b.disabled=false;b.innerText='🃏 Открыть за 3 🪙';}},1000);
}
</script>
</head>
<body onload="updM();if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}setInterval(function(){var n=new Date(),y=new Date(n.getFullYear()+1,0,1),d=y-n;document.getElementById('cd').innerText=Math.floor(d/864e5)+'д '+Math.floor(d/36e5%24)+'ч '+Math.floor(d/6e4%60)+'м '+Math.floor(d/1e3%60)+'с';},500)">
<svg style="display:none">
<symbol id="sf" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1M12 5l-2.5-2.5M12 5l2.5-2.5M12 19l-2.5 2.5M12 19l2.5 2.5M5 12l-2.5-2.5M5 12l-2.5 2.5M19 12l2.5-2.5M19 12l2.5 2.5"/></symbol>
<symbol id="st" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></symbol>
</svg>
<div class="card" id="c">
<div id="v1">
<div class="top">
<svg class="dec" style="left:16px;top:16px;width:28px;height:28px"><use href="#sf"/></svg><svg class="dec" style="left:44px;top:4px;width:13px;height:13px"><use href="#st"/></svg><svg class="dec" style="left:10px;bottom:14px;width:13px;height:13px"><use href="#st"/></svg><svg class="dec" style="left:36px;bottom:20px;width:15px;height:15px"><use href="#st"/></svg>
<div class="ava"><img src="c2e141b3bc262e2364d393de592dc9b9.jpg"></div>
<svg class="dec" style="right:42px;top:4px;width:14px;height:14px"><use href="#st"/></svg><svg class="dec" style="right:10px;top:14px;width:34px;height:34px"><use href="#sf"/></svg><svg class="dec" style="right:40px;bottom:22px;width:13px;height:13px"><use href="#st"/></svg><svg class="dec" style="right:14px;bottom:8px;width:24px;height:24px"><use href="#sf"/></svg>
</div>
<div class="name"><svg style="width:20px;height:20px;color:#c99a62"><use href="#sf"/></svg><h1>@Empty23AM</h1><svg style="width:20px;height:20px;color:#c99a62"><use href="#sf"/></svg></div>
<p>Зимний автоответчик.<br>Напиши в чат или кинь снежок прямо здесь.</p>
<div class="tbox"><div class="tt">⏳ До Нового года</div><div class="tv" id="cd">43д 11ч 00м 00с</div></div>
<button class="btn b1" onclick="var c=document.getElementById('c');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');var ok=Math.random()<.5;if(ok)k++;document.getElementById('r').innerText=ok?'☃️ Прямое попадание! ('+k+')':'⛄️ Промах! В сугроб ('+k+')'">⛄️ Бросить снежок</button>
<button class="btn b2" onclick="go('v4')">🎮 Мини-игра</button>
<button class="btn b2" onclick="if(window.Telegram&&Telegram.WebApp)Telegram.WebApp.close()">✉️ Написать сообщение</button>
<div class="res" id="r"></div>
</div>
<div id="v4" style="display:none">
<div class="hd"><button class="sm" onclick="go('v1')">← Назад</button><button class="sm" id="mb" onclick="var a=document.getElementById('bg');if(a.paused){a.play();this.innerText='🔊';}else{a.pause();this.innerText='🔇';}">🔇</button><span class="bal">🪙 <span id="m1">0</span></span></div>
<div class="cbw"><div class="cbf" id="cbf"></div></div>
<div class="cbt" id="cbt">Кликай быстро для ×2!</div>
<div class="clk" onclick="tap(event)"><img src="click.jpg"></div>
<button class="btn b1" onclick="go('v2')">🃏 Открыть карточки (3 🪙)</button>
</div>
<div id="v2" style="display:none">
<div class="hd"><button class="sm" onclick="go('v4')">← Кликер</button><span class="bal">🪙 <span id="m2">0</span></span><button class="sm" onclick="go('v3')">🗂 <span id="cnt">0</span>/15</button></div>
<div class="slot" id="sl"><span style="font-size:44px">🎁</span></div>
<button class="btn b1" id="rb" onclick="roll()">🃏 Открыть за 3 🪙</button>
<div class="res" id="mr"></div>
<button class="rst" onclick="go('v5')">🗑 Сбросить прогресс</button>
</div>
<div id="v3" style="display:none">
<div class="hd"><button class="sm" onclick="go('v2')">← В игру</button><span style="font-size:13px;font-weight:700;color:#78350f">Коллекция</span></div>
<div class="grid" id="gr"></div>
</div>
<div id="v5" style="display:none;padding:12px 4px">
<div style="font-size:38px;margin-bottom:8px">⚠️</div>
<h1 style="font-size:18px;margin-bottom:8px">Сбросить прогресс?</h1>
<p style="margin-bottom:4px">Все накопленные монетки и открытые карточки будут удалены навсегда.</p>
<div class="row">
<button class="btn b1" style="margin:0" onclick="go('v2')">Отмена</button>
<button class="btn bred" style="margin:0" onclick="wipe()">Да, сбросить</button>
</div>
</div>
</div>
<audio id="bg" src="music.mp3" loop></audio>
<div id="ov" class="ov" onclick="this.style.display='none'"></div>
</body>
</html>
