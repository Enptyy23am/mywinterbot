<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>@Empty23AM</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f172a url('4474c952b6a4acef4c2e620dcb8a7b76.jpg') center/cover no-repeat;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:26px;padding:28px 22px;width:100%;max-width:360px;text-align:center;z-index:2;box-shadow:0 20px 45px rgba(0,0,0,.35)}
.shake{animation:sh .35s ease}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ava{width:90px;height:90px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:6px}
p{font-size:14px;color:#334155;margin-bottom:18px;line-height:1.4}
.tbox{background:rgba(241,245,249,.9);border-radius:16px;padding:12px;margin-bottom:18px}
.tt{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#0284c7;font-weight:700;margin-bottom:4px}
.tv{font-size:18px;font-weight:700;color:#0f172a}
.btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn:active{transform:scale(.96)}
.b1{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;box-shadow:0 6px 18px rgba(56,189,248,.4)}
.b2{background:#fff;color:#1e293b;border:1px solid #e2e8f0}
.res{margin-top:8px;font-size:14px;min-height:20px;color:#0284c7;font-weight:600}
</style>
</head>
<body>
<canvas id="s"></canvas>
<div class="card" id="c">
<div class="ava"><img src="c2e141b3bc262e2364d393de592dc9b9.jpg"></div>
<h1>@Empty23AM</h1>
<p>Зимний автоответчик.<br>Напиши в чат или кинь снежок прямо здесь.</p>
<div class="tbox"><div class="tt">⏳ До Нового года</div><div class="tv" id="cd">...</div></div>
<button class="btn b1" onclick="hit()">❄️ Бросить снежок</button>
<button class="btn b2" onclick="tg.close()">✉️ Написать сообщение</button>
<div class="res" id="r"></div>
</div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
function upd(){
const n=new Date(),ny=new Date(n.getFullYear()+1,0,1),df=ny-n;
const d=Math.floor(df/864e5),h=Math.floor(df/36e5%24),m=Math.floor(df/6e4%60),s=Math.floor(df/1e3%60);
document.getElementById('cd').innerText=`${d}д ${h}ч ${m}м ${s}с`;
}
setInterval(upd,1000);upd();
let k=0;
function hit(){
const c=document.getElementById('c');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');
const ok=Math.random()<.5;if(ok)k++;
document.getElementById('r').innerText=ok?`☃️ Прямое попадание! Попаданий: ${k}`:`❄️ Промах! Снежок улетел в сугроб (${k})`;
}
const cv=document.getElementById('s'),cx=cv.getContext('2d');
let w=cv.width=innerWidth,h=cv.height=innerHeight;
const fl=Array.from({length:75},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*3+1.5,d:Math.random()+.5}));
function dr(){
cx.clearRect(0,0,w,h);cx.fillStyle="rgba(255,255,255,.85)";cx.beginPath();
for(let f of fl){cx.moveTo(f.x,f.y);cx.arc(f.x,f.y,f.r,0,6.28);}
cx.fill();
for(let f of fl){f.y+=f.d;f.x+=Math.sin(f.y*.01)*.6;if(f.y>h){f.y=-5;f.x=Math.random()*w;}}
requestAnimationFrame(dr);
}
dr();
</script>
</body>
</html>
